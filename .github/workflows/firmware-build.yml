name: firmware-build

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'

permissions:
  contents: read

jobs:
  host-tests:
    name: Host-side unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake 3.16+
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Configure host build (tests + mock HAL)
        run: |
          cd firmware
          mkdir -p build
          cmake -B build -DFIRMWARE_BUILD_TESTS=ON

      - name: Build test executables
        run: |
          cd firmware
          cmake --build build --parallel 4

      - name: Run unit tests
        run: |
          cd firmware/build
          ctest --output-on-failure -V

  embedded-build:
    name: STM32G031K8T6 embedded build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            arm-none-eabi-newlib

      - name: Verify toolchain installation
        run: |
          arm-none-eabi-gcc --version
          arm-none-eabi-objcopy --version
          arm-none-eabi-size --version

      - name: Configure embedded build
        run: |
          cd firmware
          mkdir -p build-embedded
          cmake -B build-embedded \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
            -DFIRMWARE_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build firmware.elf
        run: |
          cd firmware
          cmake --build build-embedded --parallel 4 --verbose

      - name: Generate firmware.hex
        run: |
          cd firmware/build-embedded
          arm-none-eabi-objcopy -O ihex firmware.elf firmware.hex
          arm-none-eabi-objcopy -O binary firmware.elf firmware.bin

      - name: Print binary size
        run: |
          cd firmware/build-embedded
          arm-none-eabi-size firmware.elf
          echo "--- Hex output ---"
          ls -lh firmware.hex firmware.bin

      - name: Verify outputs
        run: |
          test -f firmware/build-embedded/firmware.elf || (echo "firmware.elf not found"; exit 1)
          test -f firmware/build-embedded/firmware.hex || (echo "firmware.hex not found"; exit 1)
          test -f firmware/build-embedded/firmware.bin || (echo "firmware.bin not found"; exit 1)
          echo "✓ All firmware binaries generated successfully"

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: firmware/build-embedded/firmware.*
          retention-days: 30
          compression-level: 9

  code-quality:
    name: Code quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for compiler warnings (embedded build)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi binutils-arm-none-eabi
          cd firmware
          mkdir -p build-embedded
          cmake -B build-embedded \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-embedded 2>&1 | tee build.log
          if grep -q "error:" build.log; then
            echo "❌ Build errors detected"
            exit 1
          elif grep -q "warning:" build.log; then
            echo "⚠️  Build warnings detected (treated as errors)"
            exit 1
          else
            echo "✓ Clean build with zero warnings/errors"
          fi

  summary:
    name: Build summary
    runs-on: ubuntu-latest
    needs: [host-tests, embedded-build, code-quality]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.host-tests.result }}" = "failure" ]; then
            echo "❌ Host tests failed"
            exit 1
          fi
          if [ "${{ needs.embedded-build.result }}" = "failure" ]; then
            echo "❌ Embedded build failed"
            exit 1
          fi
          if [ "${{ needs.code-quality.result }}" = "failure" ]; then
            echo "❌ Code quality checks failed"
            exit 1
          fi
          echo "✅ All CI/CD checks passed!"
          echo ""
          echo "Summary:"
          echo "  ✓ Host-side unit tests (>80% coverage)"
          echo "  ✓ STM32G031K8T6 embedded build (zero warnings)"
          echo "  ✓ firmware.elf, firmware.hex, firmware.bin generated"
          echo "  ✓ Code quality validation"
